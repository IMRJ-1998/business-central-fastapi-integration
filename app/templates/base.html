<!doctype html>
<html lang="en" class="h-full bg-slate-50">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}BC Integration{% endblock %}</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-full text-slate-900">
<header class="border-b bg-white">
<div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4">
<a href="/" class="text-xl font-bold">BC Integration</a>
{% if user %}<nav class="flex flex-wrap items-center gap-4 text-sm">
<a href="/">Dashboard</a>
{% if user.role == "admin" %}<a href="/admin/users">Users</a><a href="/admin/settings">BC Settings</a>{% endif %}
<span class="rounded-full bg-slate-100 px-3 py-1">{{ user.username }} · {{ user.role }}</span>
<form method="post" action="/logout"><button class="text-red-600">Logout</button></form>
</nav>{% endif %}
</div></header>
<main class="mx-auto max-w-7xl px-6 py-8">{% block content %}{% endblock %}</main>
</body></html>
